      <button class="icon-btn menu-btn" id="menuBtn" title="菜单">☰</button>
      <div class="search-wrap">
        <input id="search" type="search" placeholder="搜索道具 / 武器 / 防具 / 怪物 / 任务 / 技能…" autocomplete="off" />
        <div class="search-panel" id="searchPanel" hidden></div>
      </div>
      <div class="topbar-right">
        <label class="lang-pick">
          <span>语言</span>
          <select id="langSelect"></select>
        </label>
        <span class="counts" id="topCounts"></span>
      </div>

    <main id="view" class="view"></main>

    <header class="skill-preview-head">
      <div><h2 id="skillPreviewName">技能详情</h2><p id="skillPreviewPoints"></p></div>
      <button type="button" class="btn sm" id="skillPreviewClose" autofocus>关闭</button>
    </header>
    <div class="skill-preview-body" id="skillPreviewBody"></div>
  </article>
</dialog>
